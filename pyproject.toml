[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-blackbox"
version = "0.1.0"
description = "The Deterministic Flight Data Recorder for Autonomous Coding Sessions. Captures hypotheses, transient diffs, test verdicts, and decision branches with zero-loss resume tokens."
readme = "README.md"
authors = [{ name = "aipd506", email = "aipd506@users.noreply.github.com" }]
license = { text = "MIT" }
keywords = [
    "ai-agent",
    "flight-recorder",
    "context-window",
    "resume-token",
    "coding-agent",
    "cursor",
    "claude",
    "mcp",
    "developer-tools",
    "decision-tree"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities"
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0"
]

[project.scripts]
blackbox = "agent_blackbox.cli:main"
agent-blackbox = "agent_blackbox.cli:main"

[project.urls]
Homepage = "https://github.com/aipd506/agent-blackbox"
Repository = "https://github.com/aipd506/agent-blackbox"
Issues = "https://github.com/aipd506/agent-blackbox/issues"

[tool.setuptools.packages.find]
where = ["src"]
